<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#49a8e8" />
    <meta name="description" content="휴대폰 파일과 날짜별 할 일을 한 곳에서 정리하는 개인 정리함" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2349a8e8'/%3E%3Cpath d='M15 22a5 5 0 0 1 5-5h10l5 6h9a5 5 0 0 1 5 5v17a5 5 0 0 1-5 5H20a5 5 0 0 1-5-5V22Z' fill='white'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="./style.css" />
    <title>모아 — 내 파일과 할 일</title>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="주요 메뉴">
        <a class="brand" href="#" aria-label="모아 홈">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M3.5 7.5A2.5 2.5 0 0 1 6 5h4.1l2 2.5H18A2.5 2.5 0 0 1 20.5 10v7.5A2.5 2.5 0 0 1 18 20H6a2.5 2.5 0 0 1-2.5-2.5v-10Z"/></svg>
          </span>
          <span>모아</span>
        </a>

        <nav class="nav-list">
          <button class="nav-item active" type="button" data-scroll="filesSection">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5h3.7l2 2.5h5.3A2.5 2.5 0 0 1 20 10v7A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5v-9Z"/></svg>
            모든 파일
          </button>
          <button class="nav-item" type="button" data-category="image">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1.5"/><path d="m5 17 4.5-4.5 3 3 2.2-2.2L19 17.6"/></svg>
            사진
          </button>
          <button class="nav-item" type="button" data-category="video">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5.5" width="13" height="13" rx="3"/><path d="m16.5 10 4-2v8l-4-2"/></svg>
            동영상
          </button>
          <button class="nav-item" type="button" data-category="document">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h7l5 5V20H6z"/><path d="M13 3.5V9h5M9 13h6M9 16h6"/></svg>
            문서
          </button>
          <button class="nav-item" type="button" data-scroll="todoSection">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16M8 14l1.5 1.5L13 12"/></svg>
            할 일
          </button>
        </nav>

        <div class="storage-card">
          <div class="storage-head"><span>저장 공간</span><strong id="storageLabel">0 MB</strong></div>
          <div class="progress" aria-hidden="true"><span id="storageBar"></span></div>
          <p>이 기기의 브라우저에 안전하게 저장돼요.</p>
        </div>

        <div class="profile">
          <div class="avatar">나</div>
          <div><strong>나의 정리함</strong><span>개인 공간</span></div>
          <button type="button" aria-label="설정"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="2.5"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/></svg></button>
        </div>
      </aside>

      <main>
        <header class="topbar">
          <div>
            <p id="todayLabel" class="eyebrow"></p>
            <h1>안녕하세요, 오늘도 가볍게 정리해볼까요?</h1>
          </div>
          <div class="top-actions">
            <label class="search-box" for="searchInput">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
              <input id="searchInput" type="search" placeholder="파일 이름 검색" autocomplete="off" />
            </label>
            <button class="icon-button" id="focusTodo" type="button" aria-label="오늘 할 일 보기">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 8.5h18C21 15 18 15 18 8Z"/><path d="M10 20h4"/></svg>
              <span id="taskBadge" class="badge" hidden>0</span>
            </button>
            <label class="primary-button" for="fileInput">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v12M7 9l5-5 5 5M5 16v3h14v-3"/></svg>
              파일 추가
            </label>
            <input id="fileInput" class="visually-hidden" type="file" multiple />
          </div>
        </header>

        <section class="summary-grid" aria-label="정리 현황">
          <article class="summary-card featured">
            <div class="summary-icon"><svg viewBox="0 0 24 24"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5h3.7l2 2.5h5.3A2.5 2.5 0 0 1 20 10v7A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5v-9Z"/></svg></div>
            <div><span>전체 파일</span><strong id="totalFiles">0</strong><small>개</small></div>
            <p id="recentStatus">첫 파일을 추가해보세요</p>
          </article>
          <article class="summary-card">
            <div class="summary-icon image"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1.5"/><path d="m5 17 4.5-4.5 3 3 2.2-2.2L19 17.6"/></svg></div>
            <div><span>사진</span><strong id="imageCount">0</strong><small>개</small></div>
          </article>
          <article class="summary-card">
            <div class="summary-icon video"><svg viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="13" height="13" rx="3"/><path d="m16.5 10 4-2v8l-4-2"/></svg></div>
            <div><span>동영상</span><strong id="videoCount">0</strong><small>개</small></div>
          </article>
          <article class="summary-card">
            <div class="summary-icon document"><svg viewBox="0 0 24 24"><path d="M6 3.5h7l5 5V20H6z"/><path d="M13 3.5V9h5M9 13h6M9 16h6"/></svg></div>
            <div><span>문서 및 기타</span><strong id="documentCount">0</strong><small>개</small></div>
          </article>
        </section>

        <div class="content-grid">
          <section class="panel files-panel" id="filesSection">
            <div class="panel-head">
              <div><h2>최근 파일</h2><p id="fileCaption">추가한 파일을 한눈에 확인하세요</p></div>
              <div class="view-controls">
                <select id="sortSelect" aria-label="파일 정렬">
                  <option value="newest">최근 추가순</option>
                  <option value="name">이름순</option>
                  <option value="size">큰 용량순</option>
                </select>
                <button class="view-toggle active" type="button" data-view="grid" aria-label="격자로 보기"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg></button>
                <button class="view-toggle" type="button" data-view="list" aria-label="목록으로 보기"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="5" cy="6" r="1"/><circle cx="5" cy="12" r="1"/><circle cx="5" cy="18" r="1"/></svg></button>
              </div>
            </div>
            <div id="fileGrid" class="file-grid" aria-live="polite"></div>
            <div id="emptyFiles" class="empty-state">
              <div class="empty-icon"><svg viewBox="0 0 24 24"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5h3.7l2 2.5h5.3A2.5 2.5 0 0 1 20 10v7A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5v-9Z"/><path d="M12 11v5M9.5 13.5H14.5"/></svg></div>
              <strong>아직 추가된 파일이 없어요</strong>
              <p>사진, 동영상, 문서를 올리면 종류별로 자동 정리돼요.</p>
              <label class="secondary-button" for="fileInput">첫 파일 추가하기</label>
            </div>
          </section>

          <aside class="panel todo-panel" id="todoSection">
            <div class="panel-head todo-title">
              <div><h2>오늘의 할 일</h2><p id="selectedDateLabel"></p></div>
              <input id="datePicker" type="date" aria-label="할 일 날짜 선택" />
            </div>
            <div id="weekStrip" class="week-strip" aria-label="날짜 선택"></div>
            <form id="todoForm" class="todo-form">
              <input id="todoInput" type="text" maxlength="80" placeholder="할 일을 입력하세요" aria-label="새 할 일" required />
              <button type="submit" aria-label="할 일 추가"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
            </form>
            <div id="todoProgress" class="todo-progress"></div>
            <ul id="todoList" class="todo-list" aria-live="polite"></ul>
            <div id="emptyTodos" class="empty-todos">
              <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="m8 12 2.2 2.2L16 8.5"/></svg>
              <p>이 날짜에 등록된 할 일이 없어요.</p>
            </div>
          </aside>
        </div>
      </main>
    </div>

    <nav class="mobile-nav" aria-label="모바일 메뉴">
      <button class="active" type="button" data-scroll="filesSection"><svg viewBox="0 0 24 24"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5h3.7l2 2.5h5.3A2.5 2.5 0 0 1 20 10v7A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5v-9Z"/></svg><span>파일</span></button>
      <label for="fileInput" class="mobile-add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>추가</span></label>
      <button type="button" data-scroll="todoSection"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16M8 14l1.5 1.5L13 12"/></svg><span>할 일</span></button>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="./app.js"></script>
  </body>
</html>
